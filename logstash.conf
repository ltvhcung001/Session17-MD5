input {
  tcp {
    port => 5000
    # Sửa lỗi: Cấu hình codec json_lines để Logstash tự động phân tích cú pháp JSON theo từng dòng từ Spring Boot / Logback
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "storex-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
